# KEY INSIGHTS & LESSONS LEARNED
# ============================================================================

key_insights:
  - "Each component has its own control_flows.yml that describes THAT component's architecture"
  - "control_flows.yml is NOT about the control-flow engine - it's about the component it lives in"
  - "The control flow system is self-documenting - specs generate diagrams, diagrams ARE documentation"
  - "Status tracking reveals priorities automatically - no need for separate roadmap docs"
  - "Minimize prose - only write what can't be expressed in YAML/diagrams"
  - "Design-first prevents architectural mistakes - think through data flow before coding"
  - "Visual diagrams communicate faster than prose to both humans and AI"
  - "ALWAYS update ai_context.yaml first, then ask user if documentation is needed"
  - "Let user decide documentation format - don't assume they want prose"
  - "PROMPT before creating guides, READMEs, or comprehensive documentation"
  - "BEFORE creating tests, check what already exists in tests/ and testing/ directories"
  - "ALWAYS update control_flows.yml when phase status or implementation changes - THIS IS REQUIRED"
  - "UPDATE existing test files instead of creating new ones - respect scaffolded structure"
  - "Keep pyproject.toml dependencies in sync when adding libraries"
  - "Remove '(pending migration)' notes from control_flows.yml after completing migration"

phase_migration_checklist:
  description: "Follow this checklist when migrating phases to prevent duplication and ensure completeness"
  reference: "See user_preferences.required_updates and user_preferences.test_file_policy"
  steps:
    1_before_starting:
      - "Read design_specs/control_flows.yml to see current phase status"
      - "Check phases/phase_N_*/tests/ for existing test structure"
      - "Check testing/ directory for existing integration tests"
      - "List files in step directories to see what scaffolding exists"
      - "Read existing test files to determine if they're scaffolded placeholders"
    2_during_migration:
      - "Migrate code to existing step directories (don't create new ones)"
      - "UPDATE existing test files with actual implementation (don't create new test files)"
      - "If tests are scaffolded, replace placeholder code with working tests"
      - "Add test cases to existing test files, don't create parallel test files"
      - "Don't create test_manual.py or test_integration.py if tests/ structure exists"
    3_after_migration:
      - "REQUIRED: Update design_specs/control_flows.yml phase status to IMPLEMENTED"
      - "REQUIRED: Update control_flows.yml dependencies with actual file paths"
      - "REQUIRED: Update control_flows.yml side_effects with actual artifact locations"
      - "REQUIRED: Remove '(pending migration)' notes from control_flows.yml"
      - "REQUIRED: Update step status in control_flows.yml sub_flows section"
      - "REQUIRED: Update pyproject.toml if new dependencies added"
      - "Update ai_context.yaml timestamp and migration_history"
      - "Run existing tests to verify migration"
      - "Delete any duplicate test files created"
    4_efficient_checks:
      - "Use file_search tool to find existing test files: **/test*.py"
      - "Use list_dir on tests/ directories before creating new files"
      - "Use grep_search to find phase status in control_flows.yml"
      - "Use read_file to check if tests are scaffolded (look for 'placeholder' or 'Generated by')"
      - "Check pyproject.toml for current dependencies before adding new ones"

migration_history:
  mermaid_to_graphviz:
    when: "October 2025"
    why: "Better layout algorithms, publication-quality output, no JS dependency"
    status: "Complete, Mermaid removed"
    
  branch_restructuring:
    when: "October 13, 2025"
    why: "Separate production deployment from development, protect upstream fork"
    status: "Complete, all 7 repos restructured"

# ============================================================================
# WHEN AI LOSES CONTEXT
# ============================================================================

context_restoration_steps:
  1: "Read this file (AI/ai_context.yaml) first"
  2: "Ask which component we're working on"
  3: "Read that component's design_specs/control_flows.yml"
  4: "Check if diagrams exist in design_specs/graphics/"
  5: "Read component's README.md for installation/quickstart"
  6: "Only read technical docs (DISCOVERY_SYSTEM.md, etc.) if needed for specific subsystem"
  7: "Check git status to see what's uncommitted"
  8: "Ask user what we were working on"

quick_reference:
  component_specs: "design_specs/control_flows.yml (in each component repo)"
  component_diagrams: "design_specs/graphics/ (in each component repo)"
  visualizer_code: "external/control-flow/src/control_flow_engine/visualizer/graphviz_generator.py"
  this_context_file: "AI/ai_context.yaml (main repo root)"
  
  example_locations:
    config_manager_spec: "external/config-manager/design_specs/control_flows.yml"
    deploy_manager_spec: "external/deploy-manager/design_specs/control_flows.yml"
    prober_spec: "external/prober/design_specs/control_flows.yml"
    
  important_note: |
    Each control_flows.yml describes THE COMPONENT IT'S IN, not the control-flow engine!
    The engine just reads and visualizes these specs.

# ============================================================================
# IMMEDIATE ACTION ITEMS
# ============================================================================

immediate_todos:
  architecture_decisions:
    phase_refactoring:
      priority: "HIGH"
      document: "external/config-manager/design_specs/PHASE_REFACTORING_STRATEGY.md"
      problem: "Hardcoded phase/step numbering causes brittleness"
      impact: "Reordering, deletion, or insertion requires extensive file/import changes"
      solutions_proposed:
        1: "Semantic directory names (discovery/ instead of phase_1_discovery/)"
        2: "Manifest-based ordering with dynamic loading"
        3: "Hybrid: semantic names + order from control_flows.yml (RECOMMENDED)"
      decision_needed: "User review and approval before implementation"
      questions:
        - "Should we migrate all components at once or incrementally?"
        - "Should step ordering be in control_flows.yml or phase orchestrator?"
        - "Should we auto-generate migration scripts?"
        
  pending_commits:
    control_flow:
      - "Modified graphviz_generator.py (handles nested format)"
      - "Deleted unnecessary docs (MIGRATION, etc.)"
    config_manager:
      - "Moved diagrams to graphics/ subfolder"
      - "Deleted old diagram locations"
      
  critical:
    - task: "Implement deploy-manager rollback flow"
      why: "Can't safely deploy to production without rollback capability"
      phases: ["snapshot_validation", "graceful_shutdown", "snapshot_restoration", "service_restart", "rollback_verification"]
      
  cleanup:
    - task: "Delete unnecessary documentation"
      files: ["control-flow: CONTROL_FLOWS_GUIDE.md, PROJECT_ANALYSIS.md, explain_control_flows.py"]
      why: "System is self-documenting, these duplicate what YAML expresses"
      
  investigation:
    - task: "Check prober control_flows.yml"
      why: "Understand status and identify gaps"
      
    - task: "Determine if dependency-manager needs control flow spec"
      why: "Maintain consistency across components"
