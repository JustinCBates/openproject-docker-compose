# ============================================================================
# QUESTIONS TO ASK USER
# ============================================================================

questions_to_ask:
  context:
    - "Which component are we working on?"
    - "Should I scan all control_flows.yml files to understand dependencies?"
    
  actions:
    - "Generate/regenerate flow diagrams?"
    - "Should I analyze what needs implementation?"
    - "Ready to commit these changes?"
    
  documentation:
    - "Should I create a summary document for this work?"
    - "Would you like detailed documentation, or just update ai_context.yaml?"
    - "What format would be most useful (markdown, diagram, checklist)?"
    - "May I create/update README/guide files, or would you prefer to review first?"
    
  clarifications:
    - "Where should this file go? (check file_organization)"
    - "Is this prose doc necessary, or should it be in control_flows.yml?"
    - "Should this be a technical deep-dive doc, or enhance the spec?"

user_preferences:
  documentation_creation:
    policy: "ALWAYS ASK BEFORE CREATING DOCUMENTATION"
    rationale: "User prefers to control what documentation gets created"
    examples:
      - "Don't create README.md files without asking"
      - "Don't create guide files without permission"
      - "Don't generate comprehensive documentation unprompted"
    exceptions:
      - "Updating ai_context.yaml itself (this file)"
      - "Updating existing documentation when explicitly requested"
      - "Adding inline code comments (minimal, as needed)"
    workflow:
      1: "Complete the technical work"
      2: "Update ai_context.yaml if needed"
      3: "Ask: 'Would you like me to create documentation for this?'"
      4: "Wait for user approval before creating docs"
  
  required_updates:
    policy: "ALWAYS UPDATE THESE FILES WITHOUT ASKING"
    rationale: "These files must stay in sync with code changes"
    files_to_update:
      - file: "design_specs/control_flows.yml"
        when: "Any phase status changes, implementation changes, or artifact locations change"
        what_to_update:
          - "Phase status (PLANNED → SCAFFOLDED → IMPLEMENTED → TESTED)"
          - "Dependencies list with actual file paths (remove 'pending migration')"
          - "Side effects with actual artifact locations"
          - "Implementation notes and method signatures"
          - "Step status in sub_flows section"
        critical: true
        
      - file: "pyproject.toml or requirements files"
        when: "New dependencies added or removed"
        what_to_update:
          - "dependencies list"
          - "optional-dependencies if dev/test deps"
        critical: true
        
      - file: "AI/ai_context.yaml"
        when: "Major changes, new insights, or workflow updates"
        what_to_update:
          - "last_updated timestamp"
          - "key_insights if lessons learned"
          - "migration_history for major changes"
        critical: true
  
  test_file_policy:
    policy: "UPDATE EXISTING TESTS, DON'T CREATE NEW ONES"
    rationale: "Test structure is scaffolded by control flow generator - use what exists"
    workflow:
      1: "Check phases/phase_N_*/tests/ for existing test files"
      2: "Read existing test files to see if they're scaffolded placeholders"
      3: "If scaffolded, UPDATE them with actual test implementation"
      4: "If already implemented, ADD new test cases to existing files"
      5: "ONLY create new test files if explicitly requested or truly needed"
    examples:
      good: "Update test_orchestrator_collection.py with working tests"
      bad: "Create test_manual.py alongside existing test_orchestrator_collection.py"
    applies_to:
      - "Unit tests in phases/phase_N_*/tests/unit/"
      - "Integration tests in phases/phase_N_*/tests/integration/"
      - "Step tests for individual steps"

