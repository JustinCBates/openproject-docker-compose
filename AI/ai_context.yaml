# ============================================================================
# COMMON WORKFLOWS
# ============================================================================

common_workflows:
  generate_diagrams:
    purpose: "Create visual documentation from control_flows.yml"
    steps:
      - "cd external/control-flow"
      - "Run Python script to generate diagrams (see usage above)"
      - "Check design_specs/graphics/ for generated files"
      
  analyze_status:
    purpose: "Determine what needs implementation"
    method: "Parse control_flows.yml and filter"
    look_for:
      - "status: PLANNED (designed but not coded)"
      - "Entry points without corresponding flows"
      - "Empty or minimal phase definitions"
      
  design_new_flow:
    purpose: "Add new functionality"
    steps:
      - "Add entry_point to control_flows.yml"
      - "Define flow with phases"
      - "Specify artifacts produced/consumed"
      - "Set all phases to status: PLANNED"
      - "Generate diagrams to visualize"
      - "Review design before implementing"
      
  track_implementation:
    purpose: "Update as you code"
    steps:
      - "Change status: PLANNED -> IN_PROGRESS when starting"
      - "Change status: IN_PROGRESS -> IMPLEMENTED when done"
      - "Regenerate diagrams to show progress"
      - "Commit both code and updated control_flows.yml together"

