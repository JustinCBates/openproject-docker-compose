      - "Branch management scripts"
      - "NO component-specific documentation"
    
  submodules:
    - name: "config-manager"
      path: "external/config-manager"
      purpose: "Discover, collect, validate OpenProject configuration"
      has_control_flow: true
      status: "~95% complete"
      branches: ["main", "develop", "production"]
      critical_gaps: ["update flow defined but not spec'd"]
      
    - name: "deploy-manager"
      path: "external/deploy-manager"
      purpose: "Deploy, upgrade, rollback OpenProject instances"
      has_control_flow: true
      status: "~85% complete"
      branches: ["main", "develop", "production"]
      critical_gaps: ["rollback flow PLANNED but not implemented - PRODUCTION CRITICAL"]
      
    - name: "prober"
      path: "external/prober"
      purpose: "Health checking and service monitoring"
      has_control_flow: true
      status: "Unknown - needs investigation"
      branches: ["main", "develop", "production"]
      
