# ============================================================================
# CORE PHILOSOPHY & PRINCIPLES
# ============================================================================

core_principles:
  design_first:
    - "Write control_flows.yml BEFORE implementing"
    - "Define phases, artifacts, dependencies upfront"
    - "Status markers track implementation progress"
    
  single_source_of_truth:
    - "control_flows.yml IS the documentation"
    - "Diagrams are generated, never hand-drawn"
    - "Don't duplicate in prose what YAML expresses"
    
  visual_communication:
    - "Generate professional diagrams automatically"
    - "SVG for web, PNG for docs, PDF for publication"
    - "Three diagram types: phases, artifacts, combined"
    
  minimal_documentation:
    - "Only write prose for complex subsystems"
    - "Technical deep-dives when control_flows.yml insufficient"
    - "Component READMEs for installation/quickstart only"

# ============================================================================
# CONTROL FLOW SPECIFICATION FORMAT
# ============================================================================

control_flows_yml_schema:
  location: "design_specs/control_flows.yml (in each component repo)"
  
  purpose: |
    CRITICAL: Each component has its OWN control_flows.yml that describes THAT component.
    
    Examples:
    - external/config-manager/design_specs/control_flows.yml
      → Describes config-manager's flows (discovery, collection, validation, export)
    - external/deploy-manager/design_specs/control_flows.yml  
      → Describes deploy-manager's flows (deployment, upgrade, rollback)
    - external/prober/design_specs/control_flows.yml
      → Describes prober's flows (health checks, monitoring)
    
    The control-flow engine (external/control-flow/) is just a TOOL that:
    - Reads these component-specific files
    - Generates diagrams from them
    - The engine itself does NOT have a control_flows.yml (it IS the engine)
  
  top_level_keys:
    component:
      description: "Component name, version, description"
      required: true
      
    entry_points:
      description: "CLI commands or API endpoints"
      format: "Dict of {command_name: {status, description, flow_id}}"
      required: true
      
    flows:
      description: "High-level processes (usually one main flow)"
      format: "Dict of flow_name -> {description, phases or steps}"
      required: true
      
    phases:
      description: "Individual execution steps within a flow"
      location: "Inside flows.[flow_name].phases"
      format: "List of phase objects"
      required_keys: ["phase_id", "name", "status"]
      optional_keys: ["description", "artifacts_produced", "artifacts_consumed", "sub_flows"]
      
    artifacts:
      description: "Data products (files) that flow between phases"
      format: "Dict of artifact_name -> {description, format}"
      required: true
      
    decision_points:
      description: "Configuration options that affect flow"
      format: "Dict of decision_name -> {description, options, default}"
      optional: true
      
    implementation_status:
      description: "Overall status tracking"
      format: "{overall, last_updated, notes}"
      optional: true

  status_values:
    standard_set: ["IMPLEMENTED", "PLANNED", "IN_PROGRESS", "BLOCKED"]
    case: "UPPERCASE (by convention)"
    note: "graphviz_generator.py converts to lowercase internally"
    color_mapping:
      IMPLEMENTED: "#90EE90"  # Light green
      IN_PROGRESS: "#FFE4B5"  # Moccasin
      PLANNED: "#E6E6FA"      # Lavender (pending)
      BLOCKED: "#FFB6C1"      # Light pink
    implementation_note: "Code uses 'completed'/'pending' but handles 'implemented'/'planned' through lowercase conversion"

# ============================================================================
# FILE ORGANIZATION RULES
# ============================================================================

file_organization:
  component_repos:
    design_specs:
      path: "design_specs/"
      contents:
        - name: "control_flows.yml"
          purpose: "The specification (single source of truth)"
        - name: "graphics/"
          purpose: "Auto-generated diagrams"
          contents: ["phase_flow.{svg,png,pdf}", "artifact_flow.{svg,png,pdf}", "combined_flow.{svg,png,pdf}"]
          
    docs:
      path: "docs/"
      when_to_use: "Only for complex subsystems that need technical deep-dive"
      examples: ["DISCOVERY_SYSTEM.md (config-manager)", "TUI_INTEGRATION.md (config-manager)"]
      anti_pattern: "Don't create docs that duplicate control_flows.yml"
      
    src:
      path: "src/"
      purpose: "Actual implementation code"
      
  control_flow_repo:
    structure:
      - "src/control_flow_engine/ (the engine code)"
      - "docs/ (engine usage docs)"
      - "examples/ (example specs and test scripts)"
      
  main_repo:
    contains_only:
      - "Docker orchestration files"
      - "Submodule references"
      - "Root-level CI/CD configs"
      - "AI/ folder (this context file)"
    does_not_contain:
      - "Component-specific documentation"
      - "Implementation code"

# ============================================================================
# THE GRAPHVIZ VISUALIZER
# ============================================================================

graphviz_visualizer:
  location: "external/control-flow/src/control_flow_engine/visualizer/graphviz_generator.py"
  class: "GraphvizFlowVisualizer"
  
  features:
    - "Parses both flat and nested YAML formats"
    - "Auto-detects format (looks for 'flows' vs 'phases' key)"
    - "Generates three diagram types: phases, artifacts, combined"
    - "Outputs multiple formats: SVG, PNG, PDF"
    - "Color-codes phases by status"
    - "Infers dependencies from artifact flow"
    
  diagram_types:
    phase_flow:
      description: "Shows execution sequence and dependencies"
      layout: "Top-to-bottom (TB)"
      nodes: "Phases (rounded boxes)"
      edges: "Dependencies (red bold lines)"
      
    artifact_flow:
      description: "Shows data dependencies between phases"
      layout: "Left-to-right (LR)"
      nodes: "Phases (boxes) and Artifacts (diamonds)"
      edges: "produces (green), consumed_by (blue)"
      
    combined_flow:
      description: "Complete view with phases and artifacts"
      layout: "Top-to-bottom (TB)"
      clustering: "Phases in one cluster, artifacts in another"
      
  usage:
    command_line: |
      cd external/control-flow
      python3 -c "
      from pathlib import Path
      import sys
      sys.path.insert(0, 'src')
      from control_flow_engine.visualizer.graphviz_generator import GraphvizFlowVisualizer
      viz = GraphvizFlowVisualizer(Path('../config-manager/design_specs/control_flows.yml'))
      viz.parse_yaml_spec()
      viz.generate_diagrams(Path('../config-manager/design_specs/graphics'), formats=['svg','png','pdf'])
      "
        
    programmatic: |
      from control_flow_engine.visualizer.graphviz_generator import GraphvizFlowVisualizer
      viz = GraphvizFlowVisualizer("design_specs/control_flows.yml")
      viz.parse_yaml_spec()
      viz.generate_diagrams("design_specs/graphics", formats=['svg','png','pdf'])

# ============================================================================
# ANTI-PATTERNS TO AVOID
# ============================================================================

anti_patterns:
  - pattern: "Confusing component specs with the control-flow engine"
    correct: "external/config-manager/design_specs/control_flows.yml describes config-manager"
    wrong: "Thinking it describes the control-flow engine itself"
    clarification: "Each component has its own control_flows.yml describing its OWN architecture"
    
  - pattern: "Creating prose documentation that duplicates control_flows.yml"
    why_bad: "YAML already documents structure, diagrams show it visually"
    examples: ["CONTROL_FLOWS_GUIDE.md", "PROJECT_ANALYSIS.md"]
    
  - pattern: "Generating temporary conversion files"
    why_bad: "GraphvizFlowVisualizer handles nested format directly"
    example: "control_flows_graphviz.yml"
    
  - pattern: "Putting diagrams in wrong locations"
    correct: "design_specs/graphics/ within each component"
    wrong: ["repo root", "docs folder", "src folder"]
    
  - pattern: "Auto-committing after every operation"
    correct: "Prompt user: 'Ready to commit?'"
    why_bad: "User should control git operations"
    
  - pattern: "Creating explanation scripts for self-explanatory code"
    example: "explain_control_flows.py"
    why_bad: "If it needs explanation, improve the code/spec"
    
  - pattern: "Static analysis documents"
    example: "PROJECT_ANALYSIS.md"
    why_bad: "Status changes constantly, query YAML on-demand"

